<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYP BID CALCULATOR</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--black:#0a0a0a;--white:#fafafa;--paper:#f2f1ee;--ink-900:#111;--ink-600:#4d4d4d;--ink-400:#8a8a8a;--line-300:#d8d6d0;--line-200:#e9e7e1;--red:#b3261e;--mono:'Space Mono',monospace;--display:'Anton',sans-serif;--body:'Inter',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);color:var(--ink-900);font-family:var(--body);-webkit-font-smoothing:antialiased;}
body{padding-bottom:80px;background-image:linear-gradient(var(--line-200) 1px,transparent 1px),linear-gradient(90deg,var(--line-200) 1px,transparent 1px);background-size:26px 26px;background-position:-1px -1px;}
.scoreboard{background:var(--black);color:var(--white);padding:20px 20px 16px;position:sticky;top:0;z-index:50;}
.scoreboard-top{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto 14px;gap:10px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;border:2px solid var(--white);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:13px;flex-shrink:0;}
.brand-text h1{font-family:var(--display);font-size:20px;letter-spacing:1.5px;line-height:1;font-weight:400;}
.brand-text span{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:#9a9a9a;text-transform:uppercase;}
.top-actions{display:flex;gap:6px;}
.top-actions button{font-family:var(--mono);font-size:10px;letter-spacing:1px;background:transparent;color:var(--white);border:1px solid #555;padding:8px 10px;cursor:pointer;text-transform:uppercase;}
.admin-only{display:none;}
body.is-admin .admin-only{display:inline-block;}
body.is-admin .buy-box.admin-only{display:block;}
.top-actions button:hover{background:var(--white);color:var(--black);}
.ticker{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#333;border:1px solid #333;}
.ticker-cell{background:var(--black);padding:10px 14px;}
.ticker-label{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:#8a8a8a;text-transform:uppercase;display:block;margin-bottom:4px;}
.ticker-value{font-family:var(--mono);font-size:22px;font-weight:700;}
.wrap{max-width:1200px;margin:0 auto;padding:22px 20px;}
.section-title{font-family:var(--display);font-size:26px;margin-bottom:4px;font-weight:400;}
.section-sub{font-family:var(--mono);font-size:11px;color:var(--ink-600);margin-bottom:18px;}

/* quick buy */
.buy-box{background:var(--black);color:var(--white);padding:18px;margin-bottom:26px;border:2px solid var(--black);}
.buy-title{font-family:var(--display);font-size:18px;letter-spacing:1px;margin-bottom:12px;font-weight:400;}
.buy-row{display:grid;grid-template-columns:1.2fr 1.6fr .8fr auto;gap:10px;align-items:end;}
.buy-row label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:#9a9a9a;text-transform:uppercase;margin-bottom:6px;}
.buy-row input,.buy-row select{width:100%;font-family:var(--body);font-size:15px;padding:12px;border:2px solid var(--white);background:var(--white);color:var(--black);border-radius:0;}
.buy-row input:focus,.buy-row select:focus{outline:3px solid #888;}
.btn-buy{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:14px 22px;background:var(--white);color:var(--black);border:2px solid var(--white);cursor:pointer;height:48px;}
.btn-buy:hover{background:#ddd;}
.buy-info{font-family:var(--mono);font-size:11px;color:#bbb;margin-top:10px;min-height:16px;}
.buy-info b{color:var(--white);}
.buy-info .warn{color:#ff8a80;}

/* manager cards */
.manager-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;}
.manager-card{background:var(--white);border:2px solid var(--black);padding:16px;transition:.15s;}
.manager-card.selected{box-shadow:6px 6px 0 var(--black);transform:translate(-3px,-3px);}
.manager-card.full{background:var(--black);color:var(--white);}
.manager-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;}
.manager-id-block{display:flex;align-items:center;gap:10px;min-width:0;}
.manager-avatar{width:40px;height:40px;border:2px solid currentColor;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:13px;}
.manager-name{font-family:var(--display);font-size:19px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
.mini-btn{font-family:var(--mono);font-size:10px;background:none;border:1px solid var(--ink-400);color:inherit;padding:3px 8px;cursor:pointer;}
.mini-btn:hover{border-color:currentColor;}
.coin-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.coin-label{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;opacity:.7;text-transform:uppercase;}
.coin-num{font-family:var(--mono);font-weight:700;font-size:18px;}
.coin-num.remaining{font-size:28px;}
.bar-track{height:8px;background:var(--line-200);border:1px solid var(--black);margin:8px 0 12px;overflow:hidden;}
.manager-card.full .bar-track{border-color:var(--white);background:#333;}
.bar-fill{height:100%;background:var(--black);}
.manager-card.full .bar-fill{background:var(--white);}
.count-line{font-family:var(--mono);font-size:11px;margin-bottom:8px;letter-spacing:.5px;}
.squad{list-style:none;border-top:1px solid var(--line-300);}
.manager-card.full .squad{border-color:#444;}
.squad li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-200);font-size:13px;font-weight:600;}
.manager-card.full .squad li{border-color:#2a2a2a;}
.squad li .pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.squad li .pprice{font-family:var(--mono);font-size:12px;margin-left:auto;}
.squad li .x{background:none;border:none;color:inherit;opacity:.45;cursor:pointer;font-size:16px;line-height:1;padding:0 2px;}
.squad li .x:hover{opacity:1;color:var(--red);}
.squad-empty{font-family:var(--mono);font-size:10px;color:var(--ink-400);padding-top:8px;}

/* log */
.log{margin-top:34px;}
.log-table{width:100%;border-collapse:collapse;background:var(--white);border:2px solid var(--black);font-size:13px;}
.log-table th{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;text-align:left;background:var(--black);color:var(--white);padding:9px 12px;}
.log-table td{padding:9px 12px;border-bottom:1px solid var(--line-200);}
.log-table td.num{font-family:var(--mono);font-weight:700;}
.empty-state{text-align:center;padding:36px 20px;font-family:var(--mono);font-size:12px;color:var(--ink-400);letter-spacing:1px;text-transform:uppercase;border:2px dashed var(--line-300);}
.btn-primary{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:11px 18px;background:var(--black);color:var(--white);border:2px solid var(--black);cursor:pointer;}
.btn-ghost{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:10px 16px;background:transparent;color:var(--black);border:2px solid var(--black);cursor:pointer;}
.btn-ghost:hover{background:var(--black);color:var(--white);}

/* modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,10,.8);z-index:200;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--white);border:3px solid var(--black);max-width:420px;width:100%;padding:24px;max-height:90vh;overflow-y:auto;}
.modal h3{font-family:var(--display);font-size:20px;margin-bottom:16px;text-transform:uppercase;font-weight:400;}
.field{margin-bottom:12px;}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-600);margin-bottom:6px;}
.field input{width:100%;font-family:var(--body);font-size:14px;padding:10px 12px;border:2px solid var(--black);background:var(--white);border-radius:0;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-actions button{flex:1;}
.note{font-family:var(--mono);font-size:11px;color:var(--ink-600);line-height:1.5;margin-bottom:12px;}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(150%);background:var(--black);color:var(--white);font-family:var(--mono);font-size:12px;padding:12px 22px;border:1px solid var(--white);z-index:300;transition:transform .25s ease;text-align:center;max-width:92vw;}
#toast.show{transform:translateX(-50%) translateY(0);}
#toast.err{background:var(--red);}

@media (max-width:700px){
  .brand-text h1{font-size:15px;}.brand-text span{display:none;}
  .ticker-cell{padding:8px 6px;text-align:center;}.ticker-label{font-size:7.5px;letter-spacing:1px;}.ticker-value{font-size:14px;}
  .wrap{padding:16px 12px;}
  .buy-row{grid-template-columns:1fr 1fr;}
  .buy-row .f-player{grid-column:1/-1;order:-1;}
  .btn-buy{grid-column:1/-1;width:100%;}
  .manager-grid{grid-template-columns:1fr;}
  .log-table th:nth-child(1),.log-table td:nth-child(1){display:none;}
}
</style>
</head>
<body>

<div class="scoreboard">
  <div class="scoreboard-top">
    <div class="brand">
      <div class="brand-mark">TYP</div>
      <div class="brand-text"><h1>BID CALCULATOR</h1><span id="subLabel">Public View · Read Only</span></div>
    </div>
    <div class="top-actions">
      <button id="undoBtn" class="admin-only">↶ Undo</button>
      <button id="copyBtn">Copy</button>
      <button id="settingsBtn" class="admin-only">Setup</button>
      <button id="adminToggle">Admin Login</button>
    </div>
  </div>
  <div class="ticker">
    <div class="ticker-cell"><span class="ticker-label">Total Coin Pool</span><span class="ticker-value" id="tPool">0</span></div>
    <div class="ticker-cell"><span class="ticker-label">Total Spent</span><span class="ticker-value" id="tSpent">0</span></div>
    <div class="ticker-cell"><span class="ticker-label">Players Bought</span><span class="ticker-value" id="tSold">0 / 0</span></div>
  </div>
</div>

<div class="wrap">
  <div class="empty-state" id="waitBox" style="display:none;margin-bottom:22px;"></div>
  <div class="buy-box admin-only">
    <div class="buy-title">PLAYER KINUN</div>
    <div class="buy-row">
      <div class="f-mgr"><label>Manager</label><select id="bMgr"></select></div>
      <div class="f-player"><label>Player Name</label><input id="bName" type="text" placeholder="player er naam likhun" autocomplete="off"></div>
      <div class="f-coin"><label>Coin</label><input id="bCoin" type="number" inputmode="numeric" min="0" placeholder="0"></div>
      <button class="btn-buy" id="bBtn">Confirm ✓</button>
    </div>
    <div class="buy-info" id="bInfo"></div>
  </div>

  <div class="section-title">Manager Squads</div>
  <div class="section-sub" id="mgrSub"></div>
  <div class="manager-grid" id="mgrGrid"></div>

  <div class="log">
    <div class="section-title">Buy History</div>
    <div class="section-sub">সবশেষ কেনা আগে দেখাবে</div>
    <div id="logBox"></div>
  </div>
</div>

<!-- Setup modal -->
<div class="modal-overlay" id="setupModal">
  <div class="modal">
    <h3 id="setupTitle">Auction Setup</h3>
    <div class="field"><label>Manager সংখ্যা</label><input id="sCount" type="number" min="2" max="40" value="14"></div>
    <div class="field"><label>প্রতি Manager এর Coin</label><input id="sBudget" type="number" min="1" value="4500"></div>
    <div class="field"><label>প্রতি Manager কয়টা Player কিনবে</label><input id="sSlots" type="number" min="1" max="30" value="10"></div>
    <div class="field"><label>প্রতি Player এর Minimum Price (বাকি slot এর জন্য reserve)</label><input id="sMin" type="number" min="0" value="0"></div>
    <div class="note" id="setupNote">Manager এর নাম পরে card এ নামের উপর ক্লিক করে বদলানো যাবে।</div>
    <div class="modal-actions">
      <button class="btn-ghost" id="sCancel">Cancel</button>
      <button class="btn-primary" id="sSave">Start</button>
    </div>
    <div style="margin-top:14px;border-top:1px solid var(--line-300);padding-top:12px;" id="resetWrap">
      <button class="btn-ghost" id="sReset" style="width:100%;border-color:var(--red);color:var(--red);">Reset Everything</button>
    </div>
  </div>
</div>

<!-- Admin login modal -->
<div class="modal-overlay" id="adminModal">
  <div class="modal">
    <h3>Admin Login</h3>
    <div class="field"><label>Password</label><input id="passInput" type="password" placeholder="পাসওয়ার্ড দিন"></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="aCancel">Cancel</button>
      <button class="btn-primary" id="aLogin">Login</button>
    </div>
  </div>
</div>

<!-- Rename modal -->
<div class="modal-overlay" id="renameModal">
  <div class="modal">
    <h3>Manager Name</h3>
    <div class="field"><label>Name</label><input id="rName" type="text"></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="rCancel">Cancel</button>
      <button class="btn-primary" id="rSave">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* =========================================================
   FIREBASE CONFIG — TYP (typ-chapm) প্রজেক্ট
   (এই টুল আলাদা path "bidCalcSimple/" ব্যবহার করে, অন্য ডাটার সাথে মিলবে না)
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDjJ2VeApQLcZZJK0gJIUv9XfCnW_Vj9eU",
  authDomain: "typ-chapm.firebaseapp.com",
  databaseURL: "https://typ-chapm-default-rtdb.firebaseio.com",
  projectId: "typ-chapm",
  storageBucket: "typ-chapm.firebasestorage.app",
  messagingSenderId: "458844107492",
  appId: "1:458844107492:web:78725241c1b5a7c80132f1",
  measurementId: "G-D4N1KH50CE"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const ROOT="bidCalcSimple";
const ADMIN_PASSWORD="typadmin2026"; // নিজের পাসওয়ার্ড দাও

let S=null;            // {budget,slots,minPrice,managers:[{id,name}],buys:[{id,mid,player,price,t}]}
let loaded=false;
let isAdmin=sessionStorage.getItem('typBidAdmin')==='1';
let renameId=null;

const $=id=>document.getElementById(id);
const fmt=n=>Number(n).toLocaleString('en-US');
const norm=s=>s.trim().replace(/\s+/g,' ').toLowerCase();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg,err){const t=$('toast');t.textContent=msg;t.className='show'+(err?' err':'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2400);}
function dbErr(e){console.error(e);toast('Firebase এ save হয়নি — নেট/rules চেক করো',true);}

/* ---------- Live listener ---------- */
db.ref(ROOT).on('value',snap=>{
  const v=snap.val();
  loaded=true;
  if(!v||!v.settings){S=null;}
  else{
    const ms=Object.entries(v.managers||{}).map(([id,m])=>({id,name:m.name,order:m.order||0})).sort((a,b)=>a.order-b.order);
    const bs=Object.entries(v.buys||{}).map(([id,b])=>({id,mid:b.mid,player:b.player,price:b.price,t:b.t||0})).sort((a,b)=>a.t-b.t);
    S={budget:v.settings.budget,slots:v.settings.slots,minPrice:v.settings.minPrice||0,managers:ms,buys:bs};
  }
  refresh();
},err=>{loaded=true;toast('Firebase connect হয়নি: '+err.message,true);refresh();});

function refresh(){
  applyAdminUI();
  const wait=$('waitBox');
  if(!S){
    wait.style.display='block';
    wait.textContent=!loaded?'লোড হচ্ছে...':(isAdmin?'Setup করে auction শুরু করো':'Auction এখনো শুরু হয়নি');
    $('mgrGrid').innerHTML='';$('logBox').innerHTML='';$('mgrSub').textContent='';
    $('tPool').textContent='0';$('tSpent').textContent='0';$('tSold').textContent='0 / 0';
    if(loaded&&isAdmin&&!$('setupModal').classList.contains('open'))openSetup(true);
    return;
  }
  wait.style.display='none';
  if($('setupModal').classList.contains('open')&&$('sCancel').style.display==='none')$('setupModal').classList.remove('open');
  render();
}

/* ---------- Admin ---------- */
function applyAdminUI(){
  document.body.classList.toggle('is-admin',isAdmin);
  $('adminToggle').textContent=isAdmin?'Logout':'Admin Login';
  $('subLabel').textContent=isAdmin?'Admin Mode · Edit Enabled':'Public View · Read Only';
}
$('adminToggle').onclick=()=>{
  if(isAdmin){isAdmin=false;sessionStorage.removeItem('typBidAdmin');refresh();toast('Admin mode বন্ধ হয়েছে');}
  else{$('passInput').value='';$('adminModal').classList.add('open');setTimeout(()=>$('passInput').focus(),30);}
};
function doLogin(){
  if($('passInput').value===ADMIN_PASSWORD){
    isAdmin=true;sessionStorage.setItem('typBidAdmin','1');
    $('adminModal').classList.remove('open');refresh();toast('Admin মোড চালু হয়েছে');
  }else toast('ভুল পাসওয়ার্ড',true);
}
$('aLogin').onclick=doLogin;
$('aCancel').onclick=()=>$('adminModal').classList.remove('open');
$('passInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

function stats(mid){
  const b=S.buys.filter(x=>x.mid===mid);
  const spent=b.reduce((a,x)=>a+x.price,0);
  const left=S.slots-b.length;
  const remaining=S.budget-spent;
  const maxBid=left>0?remaining-(left-1)*S.minPrice:0;
  return {buys:b,spent,count:b.length,left,remaining,maxBid};
}

function render(){
  if(!S)return;
  const n=S.managers.length;
  $('tPool').textContent=fmt(n*S.budget);
  $('tSpent').textContent=fmt(S.buys.reduce((a,x)=>a+x.price,0));
  $('tSold').textContent=S.buys.length+' / '+(n*S.slots);
  $('mgrSub').textContent=n+' MANAGER · '+fmt(S.budget)+' COIN · প্রতিজন '+S.slots+' জন প্লেয়ার কিনবে';

  const sel=$('bMgr'),cur=sel.value;
  sel.innerHTML=S.managers.map(m=>{const st=stats(m.id);return `<option value="${m.id}" ${st.left<=0?'disabled':''}>${esc(m.name)} — ${fmt(st.remaining)} coin${st.left<=0?' (FULL)':''}</option>`}).join('');
  if(cur&&[...sel.options].some(o=>o.value===cur&&!o.disabled))sel.value=cur;
  else{const f=[...sel.options].find(o=>!o.disabled);if(f)sel.value=f.value;}

  $('mgrGrid').innerHTML=S.managers.map((m,i)=>{
    const st=stats(m.id);
    const pct=Math.min(100,st.spent/S.budget*100);
    const full=st.left<=0;
    const rows=st.buys.map(b=>`<li><span class="pname">${esc(b.player)}</span><span class="pprice">${fmt(b.price)}</span>${isAdmin?`<button class="x" data-del="${b.id}" title="Remove">×</button>`:''}</li>`).join('');
    return `<div class="manager-card ${full?'full':''} ${isAdmin&&sel.value===m.id?'selected':''}">
      <div class="manager-head">
        <div class="manager-id-block"><div class="manager-avatar">${i+1}</div><div class="manager-name" ${isAdmin?`data-ren="${m.id}" title="Rename"`:''}>${esc(m.name)}</div></div>
        ${isAdmin?`<button class="mini-btn" data-pick="${m.id}">${full?'FULL':'SELECT'}</button>`:(full?'<span class="mini-btn">FULL</span>':'')}
      </div>
      <div class="coin-row"><span class="coin-label">Remaining</span><span class="coin-num remaining">${fmt(st.remaining)}</span></div>
      <div class="coin-row"><span class="coin-label">Spent</span><span class="coin-num">${fmt(st.spent)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="count-line">PLAYERS ${st.count} / ${S.slots}${full?'':' · MAX BID '+fmt(Math.max(0,st.maxBid))}</div>
      ${rows?`<ul class="squad">${rows}</ul>`:'<div class="squad-empty">এখনো কোনো player কেনেনি</div>'}
    </div>`;
  }).join('');

  const mname=id=>(S.managers.find(m=>m.id===id)||{name:'?'}).name;
  if(!S.buys.length)$('logBox').innerHTML='<div class="empty-state">এখনো কেউ কিছু কেনেনি</div>';
  else $('logBox').innerHTML='<table class="log-table"><thead><tr><th>#</th><th>Player</th><th>Manager</th><th>Coin</th></tr></thead><tbody>'+
    S.buys.map((b,i)=>({b,i})).reverse().map(({b,i})=>`<tr><td>${i+1}</td><td><b>${esc(b.player)}</b></td><td>${esc(mname(b.mid))}</td><td class="num">${fmt(b.price)}</td></tr>`).join('')+'</tbody></table>';
  updateInfo();
}

function updateInfo(){
  if(!S)return;
  const mid=$('bMgr').value;const info=$('bInfo');
  if(!mid){info.innerHTML='<span class="warn">সব manager এর squad full!</span>';return;}
  const st=stats(mid);
  const coin=$('bCoin').value;
  let h=`Remaining: <b>${fmt(st.remaining)}</b> · Slot বাকি: <b>${st.left}</b> · Max bid: <b>${fmt(Math.max(0,st.maxBid))}</b>`;
  if(coin!==''&&Number(coin)>st.maxBid)h+=` <span class="warn">⚠ coin বেশি হয়ে যাচ্ছে</span>`;
  else if(coin!=='')h+=` · কেনার পর থাকবে: <b>${fmt(st.remaining-Number(coin))}</b>`;
  info.innerHTML=h;
}

/* ---------- Actions (admin only) ---------- */
function buy(){
  if(!isAdmin||!S)return;
  const mid=$('bMgr').value;
  const name=$('bName').value.trim().replace(/\s+/g,' ');
  const coinRaw=$('bCoin').value;
  if(!mid)return toast('কোনো manager এর slot খালি নেই',true);
  if(!name){$('bName').focus();return toast('Player এর নাম লিখুন',true);}
  if(coinRaw===''||isNaN(coinRaw)||Number(coinRaw)<0){$('bCoin').focus();return toast('Coin লিখুন',true);}
  const price=Math.round(Number(coinRaw));
  const dup=S.buys.find(b=>norm(b.player)===norm(name));
  if(dup)return toast(name+' আগেই '+S.managers.find(m=>m.id===dup.mid).name+' কিনে ফেলেছে',true);
  const st=stats(mid);
  if(st.left<=0)return toast('এই manager এর squad full',true);
  if(price>st.maxBid)return toast('Max bid '+fmt(Math.max(0,st.maxBid))+' coin — এর বেশি দেওয়া যাবে না',true);
  const mgrName=S.managers.find(m=>m.id===mid).name;
  db.ref(`${ROOT}/buys`).push({mid,player:name,price,t:firebase.database.ServerValue.TIMESTAMP}).catch(dbErr);
  $('bName').value='';$('bCoin').value='';
  toast('✓ '+name+' → '+mgrName+' ('+fmt(price)+')');
  $('bName').focus();
}

function undo(){
  if(!isAdmin||!S||!S.buys.length)return toast('Undo করার কিছু নেই',true);
  const b=S.buys[S.buys.length-1];
  db.ref(`${ROOT}/buys/${b.id}`).remove().then(()=>toast('Undo: '+b.player+' বাদ')).catch(dbErr);
}

function copyText(){
  if(!S)return;
  let out='TYP AUCTION RESULT\n\n';
  S.managers.forEach((m,i)=>{
    const st=stats(m.id);
    out+=`${i+1}. ${m.name} — spent ${st.spent}, left ${st.remaining}\n`;
    st.buys.forEach(b=>out+=`   - ${b.player} (${b.price})\n`);
    out+='\n';
  });
  (navigator.clipboard?navigator.clipboard.writeText(out):Promise.reject()).then(()=>toast('Result copy হয়েছে')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=out;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('Result copy হয়েছে');}catch(e){toast('Copy করা গেল না',true);}ta.remove();
  });
}

/* ---------- Setup ---------- */
function openSetup(first){
  if(!isAdmin)return;
  $('setupModal').classList.add('open');
  $('sCancel').style.display=first?'none':'';
  $('resetWrap').style.display=first?'none':'';
  $('setupTitle').textContent=first?'Auction Setup':'Settings';
  $('sSave').textContent=first?'Start':'Save';
  if(S){$('sCount').value=S.managers.length;$('sBudget').value=S.budget;$('sSlots').value=S.slots;$('sMin').value=S.minPrice;}
  $('setupNote').textContent=first?'Manager এর নাম পরে card এ নামের উপর ক্লিক করে বদলানো যাবে।':'Manager সংখ্যা কমালে শুধু শেষের খালি manager রা বাদ যাবে। Budget/slot বদলালে সব হিসাব নতুন করে হবে।';
}
function saveSetup(){
  const count=parseInt($('sCount').value),budget=parseInt($('sBudget').value),slots=parseInt($('sSlots').value),minP=parseInt($('sMin').value)||0;
  if(!(count>=2)||!(budget>0)||!(slots>=1))return toast('সঠিক সংখ্যা দিন',true);
  if(minP<0||minP*slots>budget)return toast('Minimum price বেশি হয়ে গেছে',true);
  const settings={budget,slots,minPrice:minP};
  if(!S){
    const managers={};
    for(let i=0;i<count;i++)managers['m'+String(i+1).padStart(2,'0')]={name:'Manager '+(i+1),order:i+1};
    db.ref(ROOT).set({settings,managers}).then(()=>{$('setupModal').classList.remove('open');setTimeout(()=>$('bName').focus(),80);}).catch(dbErr);
  }else{
    const ms=S.managers.slice();
    const upd={settings};
    if(count>ms.length){
      for(let i=ms.length;i<count;i++){const id='m'+Date.now()+i;upd['managers/'+id]={name:'Manager '+(i+1),order:i+1};}
    }else if(count<ms.length){
      const drop=ms.slice(count);
      if(S.buys.some(b=>drop.some(d=>d.id===b.mid)))return toast('শেষের manager দের player কেনা আছে — আগে remove করুন',true);
      drop.forEach(d=>upd['managers/'+d.id]=null);
    }
    db.ref(ROOT).update(upd).then(()=>$('setupModal').classList.remove('open')).catch(dbErr);
  }
}

/* ---------- Events ---------- */
$('bBtn').onclick=buy;
['bName','bCoin'].forEach(id=>$(id).addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();if(id==='bName'&&!$('bCoin').value)$('bCoin').focus();else buy();}
}));
$('bCoin').addEventListener('input',updateInfo);
$('bMgr').addEventListener('change',render);
$('undoBtn').onclick=undo;
$('copyBtn').onclick=copyText;
$('settingsBtn').onclick=()=>openSetup(false);
$('sSave').onclick=saveSetup;
$('sCancel').onclick=()=>$('setupModal').classList.remove('open');
$('sReset').onclick=()=>{
  if(confirm('সব data মুছে নতুন করে শুরু করবেন? (সবার স্ক্রিন থেকেও মুছে যাবে)'))
    db.ref(ROOT).remove().then(()=>$('setupModal').classList.remove('open')).catch(dbErr);
};
$('mgrGrid').addEventListener('click',e=>{
  if(!isAdmin)return;
  const del=e.target.closest('[data-del]');
  if(del){const b=S.buys.find(x=>x.id===del.dataset.del);if(b&&confirm(b.player+' কে বাদ দেবেন? coin ফেরত যাবে।'))db.ref(`${ROOT}/buys/${b.id}`).remove().catch(dbErr);return;}
  const ren=e.target.closest('[data-ren]');
  if(ren){renameId=ren.dataset.ren;$('rName').value=S.managers.find(m=>m.id===renameId).name;$('renameModal').classList.add('open');setTimeout(()=>$('rName').select(),30);return;}
  const pick=e.target.closest('[data-pick]');
  if(pick){const o=[...$('bMgr').options].find(o=>o.value===pick.dataset.pick);if(o&&!o.disabled){$('bMgr').value=o.value;render();$('bName').focus();}}
});
$('rSave').onclick=()=>{
  const v=$('rName').value.trim();if(!v)return;
  db.ref(`${ROOT}/managers/${renameId}`).update({name:v}).then(()=>$('renameModal').classList.remove('open')).catch(dbErr);
};
$('rName').addEventListener('keydown',e=>{if(e.key==='Enter')$('rSave').click();});
$('rCancel').onclick=()=>$('renameModal').classList.remove('open');

applyAdminUI();
refresh();
</script>
</body>
</html>
